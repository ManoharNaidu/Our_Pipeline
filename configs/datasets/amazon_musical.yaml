# Not in the paper. No numeric attributes. Deviation: a user's text joins all their reviews, up to 321,281 tokens, far
# beyond what the model takes, so each node's source text is cut to its first 3,900 tokens before summarising.
defaults: [../base.yaml]
method: {numeric_summary: false}
summarizer: {max_source_tokens: 3900}
dataset:
  name: amazon_musical
  relations: [UPU, USU, UVU]
  question: Is this fraud?
  expected: {nodes: 11944, edges: 9557648, frauds: 821}
  reference: {source: benchmark, macro_f1: 76.45, auroc: 89.95}   # benchmark = FLAG, mean of 7 GNN backbones
